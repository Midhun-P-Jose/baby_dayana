{% extends 'core/index.html' %}
{% load static %}
{% block content %}
<div class="content-section">
    <div class="game-container">
        <h1 style="margin-bottom: 1rem;">Memory Match</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Match our special moments!</p>
        <div id="game-status" style="font-weight: bold; margin-bottom: 1rem; color: var(--primary-color);">Moves: 0</div>
        
        <div class="memory-grid" id="memory-grid">
            <!-- Cards will be generated by JS -->
        </div>
        
        <button onclick="initGame()" class="btn-primary" style="margin-top: 2rem; display: none;" id="restart-btn">Play Again</button>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const photoUrls = [
        "{% static 'core/images/first.jpeg' %}",
        "{% static 'core/images/second.jpeg' %}",
        "{% static 'core/images/third.jpeg' %}",
        "{% static 'core/images/fifth.jpeg' %}",
        "{% static 'core/images/sixth.jpeg' %}",
        "{% static 'core/images/seven.jpeg' %}"
    ];
    
    const cards = [...photoUrls, ...photoUrls];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let isLocked = false;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initGame() {
        const grid = document.getElementById('memory-grid');
        grid.innerHTML = '';
        flippedCards = [];
        matchedPairs = 0;
        moves = 0;
        isLocked = false;
        document.getElementById('game-status').innerText = `Moves: ${moves}`;
        document.getElementById('restart-btn').style.display = 'none';

        shuffle(cards);

        cards.forEach((url, index) => {
            const card = document.createElement('div');
            card.className = 'memory-card';
            card.dataset.index = index;
            card.dataset.url = url;
            card.innerHTML = `<img src="${url}" alt="Memory">`;
            card.onclick = () => flipCard(card);
            grid.appendChild(card);
        });
    }

    function flipCard(card) {
        if (isLocked || card.classList.contains('flipped')) return;

        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            moves++;
            document.getElementById('game-status').innerText = `Moves: ${moves}`;
            checkMatch();
        }
    }

    function checkMatch() {
        isLocked = true;
        const [card1, card2] = flippedCards;

        if (card1.dataset.url === card2.dataset.url) {
            matchedPairs++;
            flippedCards = [];
            isLocked = false;

            if (matchedPairs === photoUrls.length) {
                document.getElementById('game-status').innerText = `You matched all our moments in ${moves} moves! I love you! ❤️`;
                document.getElementById('restart-btn').style.display = 'inline-block';
            }
        } else {
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                flippedCards = [];
                isLocked = false;
            }, 1000);
        }
    }

    // Initialize game on load
    window.onload = initGame;
</script>
{% endblock %}
